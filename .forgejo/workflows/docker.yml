name: Build and Push Docker

on:
  push:
    branches: [ blog.kareem.one ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ["blog-ci"]
    steps:
      - name: Guardrail - trusted actor
        env:
          TRUSTED_ACTORS: "kareemlukitomo shaquille"
        run: |
          actor="${{ github.actor }}"
          for trusted_actor in ${TRUSTED_ACTORS}; do
            if [ "${actor}" = "${trusted_actor}" ]; then
              exit 0
            fi
          done

          echo "::error::Untrusted actor '${actor}'. Expected one of: ${TRUSTED_ACTORS}."
          echo "::error::Stopping workflow to avoid unauthorized image push."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}
          token: ${{ github.token }}
          github-server-url: ${{ github.server_url }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set TAG env
        run: echo "TAG=$(date +%Y%m%d%H%M)" >> "$GITHUB_ENV"

      - name: Build base Docker image
        run: make docker-base

      - name: Build Docker image
        run: make docker

      - name: Login to Forgejo registry
        env:
          REGISTRY_USER: shaquille
          REGISTRY_PASSWORD: ${{ secrets.FORGEJO_REGISTRY_TOKEN }}
        run: |
          echo "$REGISTRY_PASSWORD" | docker login git.kareem.one -u "$REGISTRY_USER" --password-stdin

      - name: Push base Docker image
        run: make push-base

      - name: Push Docker image
        run: make push

      - name: Trigger Dokploy Deployment
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        run: |
          curl --fail --show-error \
            -X POST "${DOKPLOY_URL%/}/api/application.deploy" \
            -H "accept: application/json" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"applicationId":"selfhosted-blog-dtrbrj"}'
