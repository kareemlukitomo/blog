name: Build and Push Docker

on:
  push:
    branches: [ blog.kareem.one ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ["blog-ci"]
    steps:
      - name: Checkout repository
        env:
          GIT_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -eu

          if [ -z "$GIT_TOKEN" ]; then
            echo "::error::github.token is empty"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

          cd "$GITHUB_WORKSPACE"
          git init .
          git remote add origin "${SERVER_URL}/${REPOSITORY}"

          auth_header="$(printf 'x-access-token:%s' "$GIT_TOKEN" | base64 | tr -d '\n')"
          git config --local "http.${SERVER_URL}/.extraheader" "AUTHORIZATION: basic ${auth_header}"
          git fetch --no-tags --prune --depth=1 origin "$COMMIT_SHA"
          git checkout --force FETCH_HEAD

      - name: Set TAG env
        id: set_tag
        run: echo "TAG=$(date +%Y%m%d%H%M)" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: make docker

      - name: Push Docker image
        run: make push

      - name: Trigger Dokploy Deployment
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        run: |
          curl --fail --show-error \
            -X POST "${DOKPLOY_URL%/}/api/application.deploy" \
            -H "accept: application/json" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"applicationId":"selfhosted-blog-dtrbrj"}'
