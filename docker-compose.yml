version: "3.8"

services:
  hugo:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: hugo server --gc --disableFastRender --enableGitInfo -D --bind=0.0.0.0 --port=1313
    ports:
      - "1313:1313"
    volumes:
      - .:/app
    environment:
      HUGO_CACHEDIR: /tmp/hugo_cache